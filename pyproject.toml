[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytfit5"
version = "1.0.0"
authors = [
  { name="Jason Rowe", email="jason@jasonrowe.org" },
]
description = "An implementation of TransitFit5 with Python."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "numba",
    "scipy",
    "pandas",
    "astroquery",
]

[project.optional-dependencies]
# GPU BLS kernel (pytfit5.bls_gpu); numba-cuda 0.30 needs numpy < 2.5
cuda = ["numba-cuda[cu13]", "numpy<2.5"]

[project.urls]
"Homepage" = "https://github.com/jasonfrowe/bls_cuda"
"Bug Tracker" = "https://github.com/jasonfrowe/bls_cuda/issues"

# This section tells setuptools where to find your code
[tool.setuptools.packages.find]
where = ["."]  # "." means "look in the same directory as this file"
include = ["pytfit5*"]  # Explicitly include your package folder
